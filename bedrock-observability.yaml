  # ════════════════════════════════════════════════════════════════════════════
  # AWS BUDGETS
  # Note: Budgets are global (not regional) and use Cost Explorer data which
  # has up to 8-hour lag — use CW alarms above for real-time detection.
  # Budgets are the catch-all for total spend guardrails.
  # ════════════════════════════════════════════════════════════════════════════
  BedrockMonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: Bedrock-Monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetLimit
          Unit: USD
        CostFilters:
          Service:
            - Amazon Bedrock
            - Claude Haiku 4.5 (Amazon Bedrock Edition)
            - Claude Sonnet 4.5 (Amazon Bedrock Edition)
            - Claude Sonnet 4.6 (Amazon Bedrock Edition)
            - Claude Opus 4.6 (Amazon Bedrock Edition)
            - Claude Opus 4.8 (Amazon Bedrock Edition)
            - Claude 3.5 Haiku (Amazon Bedrock Edition)
        CostTypes:
          IncludeTax: true
          IncludeSubscription: true
          UseBlended: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BedrockAlertTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BedrockAlertTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BedrockAlertTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BedrockAlertTopic

  BedrockDailyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: Bedrock-Daily
        BudgetType: COST
        TimeUnit: DAILY
        BudgetLimit:
          Amount: !Ref DailyBudgetLimit
          Unit: USD
        CostFilters:
          Service:
            - Amazon Bedrock
            - Claude Haiku 4.5 (Amazon Bedrock Edition)
            - Claude Sonnet 4.5 (Amazon Bedrock Edition)
            - Claude Sonnet 4.6 (Amazon Bedrock Edition)
            - Claude Opus 4.6 (Amazon Bedrock Edition)
            - Claude Opus 4.8 (Amazon Bedrock Edition)
            - Claude 3.5 Haiku (Amazon Bedrock Edition)
        CostTypes:
          IncludeTax: true
          IncludeSubscription: true
          UseBlended: false
      # NOTE: NotificationsWithSubscribers is a createOnly property on
      # AWS::Budgets::Budget — any diff here forces CFN to REPLACE this
      # resource (create-new before delete-old). Since BudgetName must stay
      # fixed/unique, the create call collides with the still-existing old
      # budget and fails with DuplicateRecordException (a gap in AWS's CFN
      # provider for this resource type, not fixable from our template).
      # Only alert at 100% actual — daily digest already covers running
      # spend, so this is purely the "you went over" signal.
      # This value was set directly via the Budgets API (bypassing CFN,
      # since NotificationsWithSubscribers is createOnly on this resource
      # type — see note above); kept in sync here so future unrelated stack
      # updates don't try to replace this resource and fail. To change this
      # threshold safely, either use `aws budgets update-notification`
      # directly (and update this template to match immediately after), or
      # delete+recreate the budget out-of-band before updating the stack.
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BedrockAlertTopic

  # Note: bedrock-logs retention was extended to 90 days via CLI (aws logs put-retention-policy)
  # since the log group pre-existed and CFN EarlyValidation blocks re-declaring existing log groups.
  # Cost Anomaly Detection is deployed separately in bedrock-anomaly.yaml after this stack is live,
  # because CE::AnomalySubscription requires the SNS topic to exist before CFN EarlyValidation passes.

  # ════════════════════════════════════════════════════════════════════════════
  # DAILY MORNING DIGEST — Lambda + EventBridge
  # Runs at 10:00 AM UTC (6 AM EDT) daily to report yesterday's Bedrock spend.
  # AWS Budgets resets at midnight UTC and Cost Explorer has up to 8-hour lag,
  # so delayed budget alerts can arrive unexpectedly in the morning. This digest
  # gives you a predictable daily email with actual spend before you start work,
  # replacing the surprise of a lagged threshold alert.
  # ════════════════════════════════════════════════════════════════════════════
  DigestLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bedrock-cost-digest-lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DigestPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ce:GetCostAndUsage
                Resource: '*'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref BedrockAlertTopic

  DigestLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: bedrock-daily-cost-digest
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DigestLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref BedrockAlertTopic
          DAILY_BUDGET: !Ref DailyBudgetLimit
      Code:
        ZipFile: |
          import boto3, os
          from datetime import date, timedelta

          SERVICES = [
              'Amazon Bedrock',
              'Claude Haiku 4.5 (Amazon Bedrock Edition)',
              'Claude Sonnet 4.5 (Amazon Bedrock Edition)',
              'Claude Sonnet 4.6 (Amazon Bedrock Edition)',
              'Claude Opus 4.6 (Amazon Bedrock Edition)',
              'Claude Opus 4.8 (Amazon Bedrock Edition)',
              'Claude 3.5 Haiku (Amazon Bedrock Edition)',
          ]

          def handler(event, context):
              today = date.today()
              yesterday = today - timedelta(days=1)
              start, end = str(yesterday), str(today)
              daily_budget = float(os.environ.get('DAILY_BUDGET', '75'))

              ce = boto3.client('ce', region_name='us-east-1')
              resp = ce.get_cost_and_usage(
                  TimePeriod={'Start': start, 'End': end},
                  Granularity='DAILY',
                  Filter={'Dimensions': {'Key': 'SERVICE', 'Values': SERVICES}},
                  GroupBy=[{'Type': 'DIMENSION', 'Key': 'SERVICE'}],
                  Metrics=['UnblendedCost'],
              )

              total = 0.0
              lines = []
              for result in resp['ResultsByTime']:
                  for group in result['Groups']:
                      svc = group['Keys'][0]
                      amt = float(group['Metrics']['UnblendedCost']['Amount'])
                      if amt > 0:
                          lines.append(f'  {svc}: ${amt:.4f}')
                          total += amt

              pct = (total / daily_budget * 100) if daily_budget else 0
              status = 'OVER BUDGET' if total > daily_budget else ('WARNING' if pct >= 66 else 'OK')

              if not lines:
                  body = (
                      f'Bedrock Daily Digest — {yesterday} UTC\n\n'
                      f'No Bedrock spend recorded for {yesterday}.\n'
                      f'(Data may still be processing if spend occurred late UTC.)\n\n'
                      f'Daily budget: ${daily_budget:.2f}'
                  )
              else:
                  breakdown = '\n'.join(lines)
                  body = (
                      f'Bedrock Daily Digest — {yesterday} UTC\n\n'
                      f'Total: ${total:.4f}  ({pct:.1f}% of ${daily_budget:.2f} daily budget) [{status}]\n\n'
                      f'Breakdown:\n{breakdown}\n\n'
                      f'Note: Cost Explorer data has up to 8-hour lag. This digest runs at\n'
                      f'10:00 AM UTC (6 AM EDT) so yesterday\'s full spend is captured here\n'
                      f'rather than arriving as a surprise Budget threshold alert.'
                  )

              boto3.client('sns').publish(
                  TopicArn=os.environ['SNS_TOPIC_ARN'],
                  Subject=f'[Bedrock Daily Digest — routine, not a budget alert] {yesterday} — ${total:.4f} ({status})',
                  Message=body,
              )

  DigestSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: bedrock-cost-digest-daily
      Description: Triggers daily Bedrock cost digest at 10:00 AM UTC (6 AM EDT)
      ScheduleExpression: cron(0 10 * * ? *)
      State: ENABLED
      Targets:
        - Id: DigestLambdaTarget
          Arn: !GetAtt DigestLambda.Arn

  DigestLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt DigestLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DigestSchedule.Arn

Outputs:
  SNSTopicArn:
    Value: !Ref BedrockAlertTopic
    Description: SNS topic ARN — subscribe additional emails or Slack webhooks here
    Export:
      Name: BedrockAlertTopicArn

  MonthlyBudgetName:
    Value: !Ref BedrockMonthlyBudget

  DailyBudgetName:
    Value: !Ref BedrockDailyBudget
