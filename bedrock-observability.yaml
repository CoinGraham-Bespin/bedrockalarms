AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Bedrock cost observability: SNS alerts, per-user CloudWatch metric filters and alarms,
  account-level and all-usage token-rate alarms, and a daily cost digest.

Parameters:
  AlertEmail:
    Type: String
    Default: coin.graham@bespinglobal.com
    Description: Email address to receive all Bedrock cost alerts

  # ── Per-user 5-minute token spike thresholds ──────────────────────────────
  # Tune these based on legitimate max usage per session.
  # At Haiku 4.5 pricing ($0.00025/1K input tokens), 10M tokens = ~$2.50 per 5 min.
  UserTokenAlarmThreshold:
    Type: Number
    Default: 10000000
    Description: Per-user input tokens in 5 minutes that triggers an alarm (default 10M)

  # ── Account-level thresholds (all users combined per model) ───────────────
  Haiku5MinTokenThreshold:
    Type: Number
    Default: 50000000
    Description: Account-wide Haiku 4.5 input tokens in 5 min to trigger alarm (default 50M ~= $12.50)

  Sonnet5MinTokenThreshold:
    Type: Number
    Default: 10000000
    Description: Account-wide Sonnet 4.6 input tokens in 5 min to trigger alarm (default 10M ~= $30)

  OpusAny5MinTokenThreshold:
    Type: Number
    Default: 2000000
    Description: Account-wide Opus input tokens in 5 min to trigger alarm (default 2M ~= $30)

  # ── All-usage thresholds (every model, every caller combined) ─────────────
  AllUsageInputTokenThreshold:
    Type: Number
    Default: 75000000
    Description: Total Bedrock input tokens across all models and callers in 5 min to trigger alarm (default 75M)

  AllUsageOutputTokenThreshold:
    Type: Number
    Default: 15000000
    Description: Total Bedrock output tokens across all models and callers in 5 min to trigger alarm (default 15M)

  # ── Daily digest reference ────────────────────────────────────────────────
  DailyBudgetLimit:
    Type: Number
    Default: 75
    Description: Daily Bedrock spend in USD that the morning digest reports status against (no AWS Budget; spend limits are managed in LiteLLM)

Resources:

  # ════════════════════════════════════════════════════════════════════════════
  # SNS
  # ════════════════════════════════════════════════════════════════════════════
  BedrockAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: bedrock-cost-alerts
      DisplayName: Bedrock Cost Alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref BedrockAlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Cost Anomaly Detection needs its own SNS policy to publish
  BedrockAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref BedrockAlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAnomalyDetectionPublish
            Effect: Allow
            Principal:
              Service: costalerts.amazonaws.com
            Action: sns:Publish
            Resource: !Ref BedrockAlertTopic

  # ════════════════════════════════════════════════════════════════════════════
  # PER-USER METRIC FILTERS on bedrock-logs
  # Each filter extracts inputTokenCount for one IAM user → custom CW metric
  # Metric namespace: Bedrock/UserTokens, dimension: UserName
  # ════════════════════════════════════════════════════════════════════════════

  # ── BedrockAPIKey-0ekh / Joe Conlin ───────────────────────────────────────
  MetricFilter0ekh:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: bedrock-logs
      FilterName: bedrock-user-tokens-0ekh
      FilterPattern: '{ $.identity.arn = "arn:aws:iam::051942114270:user/BedrockAPIKey-0ekh" }'
      MetricTransformations:
        - MetricNamespace: Bedrock/UserTokens
          MetricName: InputTokenCount-0ekh
          MetricValue: $.input.inputTokenCount

  Alarm0ekh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Bedrock-UserSpike-0ekh-JoeConlin
      AlarmDescription: "Joe Conlin (BedrockAPIKey-0ekh) exceeded token spike threshold in 5 min"
      Namespace: Bedrock/UserTokens
      MetricName: InputTokenCount-0ekh
      Period: 300
      EvaluationPeriods: 1
      Statistic: Sum
      Threshold: !Ref UserTokenAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref BedrockAlertTopic

  # ── BedrockAPIKey-2klj / Abhijeet Nazar ───────────────────────────────────
