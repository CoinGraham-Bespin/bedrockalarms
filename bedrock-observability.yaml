  # ════════════════════════════════════════════════════════════════════════════
  # ACCOUNT-LEVEL CLOUDWATCH ALARMS (AWS/Bedrock namespace — 5-minute native)
  # These fire on aggregate model usage regardless of which user caused it.
  # ════════════════════════════════════════════════════════════════════════════
  AlarmHaiku45Tokens:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Bedrock-AccountSpike-Haiku45-InputTokens
      AlarmDescription: "Account-wide Haiku 4.5 input token rate spike — potential runaway agent"
      Namespace: AWS/Bedrock
      MetricName: InputTokenCount
      Dimensions:
        - Name: ModelId
          Value: us.anthropic.claude-haiku-4-5-20251001-v1:0
      Period: 300
      EvaluationPeriods: 1
      Statistic: Sum
      Threshold: !Ref Haiku5MinTokenThreshold
